<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guess the Years</title>
  <meta name="description" content="Check in for the party age game with your name and age." />
  <link rel="canonical" href="https://age-game-party.web.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Guess the Years" />
  <meta property="og:title" content="Guess the Years" />
  <meta property="og:description" content="Check in with your name and age for the party game." />
  <meta property="og:url" content="https://age-game-party.web.app/" />
  <meta property="og:image" content="https://age-game--shawncountdown.us-central1.hosted.app/assets/age-game-party-share.png" />
  <meta property="og:image:secure_url" content="https://age-game--shawncountdown.us-central1.hosted.app/assets/age-game-party-share.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="941" />
  <meta property="og:image:height" content="1672" />
  <meta property="og:image:alt" content="A gold party poster for the Guess the Years game preview." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Guess the Years" />
  <meta name="twitter:description" content="Check in with your name and age for the party game." />
  <meta name="twitter:image" content="https://age-game--shawncountdown.us-central1.hosted.app/assets/age-game-party-share.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="checkin-page">
  <main class="checkin-shell" aria-labelledby="checkinTitle">
    <section class="checkin-card">
      <div class="checkin-ornament checkin-ornament-left" aria-hidden="true"></div>
      <div class="checkin-ornament checkin-ornament-right" aria-hidden="true"></div>

      <header class="checkin-hero">
        <span class="checkin-balloon" aria-hidden="true"></span>
        <div>
          <h1 id="checkinTitle">Guess the Years</h1>
          <p>Step 1: Check in with your name and age.</p>
        </div>
        <span class="checkin-party-hat" aria-hidden="true"></span>
      </header>

      <nav class="checkin-tabs" aria-label="Game sections">
        <button class="checkin-tab is-active" type="button" data-checkin-view="checkinPanel">Check In</button>
        <button class="checkin-tab" type="button" data-checkin-view="guestsPanel">Make Guess</button>
        <a class="checkin-tab checkin-tab-link" href="/host">Admin</a>
      </nav>

      <section id="checkinPanel" class="checkin-view is-active">
        <form id="userForm" class="checkin-form" autocomplete="on">
          <label class="checkin-name-field" for="userName">
            <span>Name</span>
            <input id="userName" name="name" type="text" maxlength="50" placeholder="Sam N." autocomplete="given-name" autocapitalize="words" required />
          </label>

          <div class="checkin-age-area">
            <label class="checkin-age-label" for="userAge">Age</label>
            <input id="userAge" name="age" class="checkin-age-display" type="text" inputmode="none" autocomplete="off" aria-describedby="ageHelp" readonly required />
            <p id="ageHelp" class="checkin-help">Enter your age only.</p>
          </div>

          <div class="checkin-keypad" aria-label="Age keypad">
            <button type="button" data-age-key="1">1</button>
            <button type="button" data-age-key="2">2</button>
            <button type="button" data-age-key="3">3</button>
            <button type="button" data-age-key="4">4</button>
            <button type="button" data-age-key="5">5</button>
            <button type="button" data-age-key="6">6</button>
            <button type="button" data-age-key="7">7</button>
            <button type="button" data-age-key="8">8</button>
            <button type="button" data-age-key="9">9</button>
            <button type="button" data-age-action="backspace" aria-label="Delete last digit">⌫</button>
            <button type="button" data-age-key="0">0</button>
            <button class="checkin-key-confirm" type="button" data-age-action="confirm" aria-label="Confirm age">✓</button>
          </div>

          <button id="saveAgeButton" class="checkin-save-button" type="submit">Save My Age</button>
          <p id="checkinStatus" class="checkin-status" aria-live="polite"></p>
        </form>
      </section>

      <section id="guestsPanel" class="checkin-view">
        <form id="guestGuessForm" class="guess-form" autocomplete="off">
          <label class="guess-name-field" for="guestGuessName">
            <span>Name</span>
            <select id="guestGuessName" name="name" required>
              <option value="">Choose your name</option>
            </select>
          </label>

          <div class="guess-total-area">
            <label class="guess-total-label" for="guestTotalGuess">Total Guess</label>
            <input id="guestTotalGuess" name="estimatedTotalAge" class="guess-total-display" type="text" inputmode="none" autocomplete="off" aria-describedby="guessHelp" readonly required />
            <p id="guessHelp" class="checkin-help">Guess the total age in the room.</p>
          </div>

          <div class="guess-keypad" aria-label="Total guess keypad">
            <button type="button" data-guess-key="1">1</button>
            <button type="button" data-guess-key="2">2</button>
            <button type="button" data-guess-key="3">3</button>
            <button type="button" data-guess-key="4">4</button>
            <button type="button" data-guess-key="5">5</button>
            <button type="button" data-guess-key="6">6</button>
            <button type="button" data-guess-key="7">7</button>
            <button type="button" data-guess-key="8">8</button>
            <button type="button" data-guess-key="9">9</button>
            <button type="button" data-guess-action="backspace" aria-label="Delete last digit">⌫</button>
            <button type="button" data-guess-key="0">0</button>
            <button class="checkin-key-confirm" type="button" data-guess-action="confirm" aria-label="Confirm total guess">✓</button>
          </div>

          <button id="saveGuessButton" class="checkin-save-button guest-save-button" type="submit">Save Guess</button>
          <p id="guestGuessStatus" class="checkin-status" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
